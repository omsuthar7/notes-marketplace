<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes MarketPlace - Notes Selling and Buying Platform</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/notes.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/widgets.css">

  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg">
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="#/" class="header-brand">
        <img src="/assets/images/logo.svg" alt="Notes MarketPlace Logo" id="header-logo-img">
      </a>
      
      <nav class="header-nav" id="header-nav-right">
        <!-- Dynamically rendered based on auth state & theme -->
      </nav>
    </div>
  </header>

  <!-- Main SPA View Mount -->
  <main id="app"></main>

  <!-- Site Footer matching screenshots -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-copy">
        Copyright &copy; NotesMarketPlace. All rights reserved.
      </div>
      <div class="footer-social">
        <a href="https://facebook.com" target="_blank" rel="noopener" class="social-circle" title="Facebook">f</a>
        <a href="https://twitter.com" target="_blank" rel="noopener" class="social-circle" title="Twitter">𝕏</a>
        <a href="https://linkedin.com" target="_blank" rel="noopener" class="social-circle" title="LinkedIn">in</a>
      </div>
    </div>
  </footer>

  <!-- Application JavaScript Modules -->
  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/mailbox.js"></script>
  <script src="/js/payment.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notes.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
